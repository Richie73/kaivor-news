services:
  - type: web
    name: kaivor-news
    runtime: python
    buildCommand: pip install -r requirements.txt -r requirements-postgres.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: KAIVOR_CRON_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GUARDIAN_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false
      - key: KAIVOR_READING_DATABASE_URL
        sync: false
      - key: KAIVOR_READING_PIN
        sync: false
      - key: KAIVOR_SESSION_SECRET
        sync: false
      - key: KAIVOR_COOKIE_SECURE
        value: "true"
      - key: KAIVOR_READING_REQUIRE_POSTGRES
        value: "true"
  # FP078: standalone Kaivor MCP service (Streamable HTTP) for the Muse
  # link. No healthCheckPath: the service exposes no health endpoint, so
  # Render falls back to its port check. The bearer token, agent database
  # URL and OpenRouter key are dashboard secrets (sync: false) — never
  # committed. The agent database is the existing Reading Postgres:
  # the migration (migrations/mcp/002_agent_tasks_render.sql) adds one
  # agent_tasks table to it under a least-privilege kaivor_mcp role.
  - type: web
    name: kaivor-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt -r requirements-mcp.txt -r requirements-postgres.txt
    startCommand: python run_mcp.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: KAIVOR_MCP_ENV
        value: "production"
      - key: KAIVOR_MCP_HOST
        value: "0.0.0.0"
      - key: KAIVOR_MCP_BEARER_TOKEN
        sync: false
      - key: KAIVOR_AGENT_DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: KAIVOR_MCP_ALLOWED_MEMORY_CATEGORIES
        value: ""
