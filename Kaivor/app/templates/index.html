<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaivor News</title>
    <style>
        body { background-color: #0b0b0b; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        header { padding: 16px; font-size: 20px; font-weight: bold; border-bottom: 1px solid #222; text-align: center; letter-spacing: 1px; }
        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .card { background: #161618; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #26262a; }
        .card h3 { font-size: 16px; margin: 0; line-height: 1.4; }
        .card h3 a { color: #f3f4f6; text-decoration: none; }
        .source-tag { font-size: 11px; color: #3b82f6; text-transform: uppercase; margin-bottom: 6px; display: block; font-weight: bold; }
    </style>
</head>
<body>

    <header>KAIVOR NEWS</header>

    <div class="container">
        {% for cat, articles in news_grouped.items() %}
            <h2 style="font-size: 14px; color: #9ca3af; text-transform: uppercase; margin-top: 24px; border-bottom: 1px solid #222; padding-bottom: 6px;">{{ cat }}</h2>
            {% for art in articles %}
            <div class="card">
                <span class="source-tag">{{ cat }}</span>
                <h3><a href="{{ art.link }}" target="_blank">{{ art.title }}</a></h3>
            </div>
            {% endfor %}
        {% endfor %}
    </div>

</body>
</html>
