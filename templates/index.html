<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KAIVOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: ui-sans-serif, system-ui; }
        .ticker-wrap { background: #050505; border-bottom: 1px solid #111; height: 35px; display: flex; align-items: center; }
        .ticker { white-space: nowrap; animation: scroll 25s linear infinite; font-size: 10px; font-weight: 900; }
        @keyframes scroll { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
        #modal { background: #000; z-index: 100; }
    </style>
</head>
<body class="pb-32">
    <div class="ticker-wrap fixed top-0 w-full z-50">
        <div class="ticker uppercase tracking-[0.2em] text-gray-500">
            {% for m in market %}
            <span class="mx-6 text-green-500">{{ m.symbol }}: {{ m.price }}</span>
            {% endfor %}
            <span class="mx-6 text-blue-500">SYSTEM: {{ status }}</span>
            <span class="mx-6">• KAIVOR INTELLIGENCE •</span>
        </div>
    </div>

    <header class="p-6 pt-14 flex justify-between items-center border-b border-white/5">
        <h1 class="text-3xl font-black tracking-tighter">KAIVOR</h1>
        <p class="text-2xl font-black opacity-30">18°</p>
    </header>

    <main class="p-6 space-y-12">
        {% for source, data in news.items() %}
        <section>
            <div class="flex items-center gap-3 mb-6">
                <img src="{{ data.logo }}" class="w-6 h-6 rounded" onerror="this.style.display='none'">
                <h2 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.4em]">{{ source }}</h2>
            </div>
            <div class="grid gap-6">
                {% for item in data.articles %}
                <div class="bg-[#080808] border border-white/5 rounded-[2.5rem] overflow-hidden shadow-2xl">
                    {% if item.img %}
                    <img src="{{ item.img }}" class="w-full h-48 object-cover opacity-80">
                    {% endif %}
                    <div class="p-6">
                        <a href="{{ item.link }}" class="text-[18px] font-bold leading-tight block mb-4">{{ item.title }}</a>
                        <button onclick="brief(this, '{{ item.title|replace("'", "") }}')" class="text-[10px] font-black text-blue-500 bg-blue-500/10 px-5 py-2 rounded-full uppercase">Brief Me</button>
                        <div class="hidden mt-4 text-sm text-gray-400 italic border-l-2 border-blue-600 pl-4"></div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </section>
        {% endfor %}
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] bg-white/5 backdrop-blur-2xl border border-white/10 p-5 rounded-[2rem] flex justify-around items-center z-50">
        <button onclick="location.reload()" class="text-blue-500 font-black text-[10px] uppercase">Refresh</button>
        <button onclick="document.getElementById('modal').classList.remove('hidden')" class="text-gray-400 font-black text-[10px] uppercase">Signals</button>
    </nav>

    <div id="modal" class="hidden fixed inset-0 p-8 flex flex-col justify-center">
        <h2 class="text-3xl font-black mb-8">Signal Logic</h2>
        <form action="/add" method="POST" class="space-y-4">
            <input type="text" name="name" placeholder="BBC News" class="w-full bg-white/5 p-6 rounded-3xl border border-white/10 outline-none text-white">
            <input type="url" name="url" placeholder="RSS URL" class="w-full bg-white/5 p-6 rounded-3xl border border-white/10 outline-none text-sm text-white">
            <button class="w-full bg-blue-600 p-6 rounded-3xl font-black uppercase text-sm">Connect</button>
            <button type="button" onclick="document.getElementById('modal').classList.add('hidden')" class="w-full text-gray-600 font-bold uppercase py-6 text-xs">Dismiss</button>
        </form>
    </div>

    <script>
        async function brief(btn, title) {
            btn.innerText = "THINKING...";
            const r = await fetch('/summarize', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title}) });
            const d = await r.json();
            const div = btn.nextElementSibling;
            div.innerText = d.summary; div.classList.remove('hidden');
            btn.innerText = "BRIEFED";
        }
    </script>
</body>
</html>
