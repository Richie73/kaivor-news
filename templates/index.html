<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KAIVOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: ui-sans-serif, system-ui; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .view { display: none; } .view-active { display: block; }
    </style>
</head>
<body class="pb-32">
    <!-- MARKET TERMINAL -->
    <div class="p-4 bg-[#050505] border-b border-white/5 sticky top-0 z-50 flex gap-4 overflow-x-auto no-scrollbar backdrop-blur-xl">
        {% for m in market %}
        <div class="bg-white/5 px-4 py-2 rounded-xl border border-white/10 min-w-[110px]">
            <p class="text-[9px] font-black text-gray-500 uppercase">{{ m.s }}</p>
            <p class="text-xs font-bold text-green-400">{{ m.p }}</p>
        </div>
        {% endfor %}
    </div>

    <!-- MAIN BRIEFING -->
    <main id="home" class="view view-active p-6 space-y-12">
        <h1 class="text-5xl font-black tracking-tighter">KAIVOR</h1>
        {% for source, data in news.items() %}
        <section>
            <div class="flex items-center gap-3 mb-6">
                <img src="{{ data.logo }}" class="w-6 h-6 rounded" onerror="this.style.display='none'">
                <h2 class="text-[10px] font-black text-gray-400 uppercase tracking-widest">{{ source }}</h2>
            </div>
            <div class="grid gap-6">
                {% for item in data.articles %}
                <div class="bg-[#0d0d0d] border border-white/5 rounded-[2.5rem] overflow-hidden shadow-2xl">
                    {% if item.img %}<img src="{{ item.img }}" class="w-full h-48 object-cover opacity-90">{% endif %}
                    <div class="p-6">
                        <a href="{{ item.link }}" class="text-[19px] font-bold leading-tight block mb-4">{{ item.title }}</a>
                        <button onclick="getBrief(this, '{{ item.title|replace("'", "") }}')" class="bg-blue-600/10 text-blue-500 px-5 py-2 rounded-full font-black text-[10px] uppercase">Brief Me</button>
                        <div class="hidden mt-4 text-sm text-gray-400 italic border-l-2 border-blue-600 pl-4 py-1"></div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </section>
        {% endfor %}
    </main>

    <!-- SIGNALS (AGENT) -->
    <main id="settings" class="view p-8">
        <h2 class="text-4xl font-black mb-8 tracking-tighter">Intelligence Agent</h2>
        <div class="bg-blue-600/10 border border-blue-500/20 p-8 rounded-[2.5rem] mb-10 text-center">
            <p class="text-blue-500 font-black text-[10px] uppercase mb-6 tracking-widest">Auto-Discovery</p>
            <input id="topic" type="text" placeholder="Topic (e.g. AI News)" class="w-full bg-black p-5 rounded-2xl border border-white/10 mb-4 outline-none">
            <button onclick="aiFind()" class="w-full bg-blue-600 p-5 rounded-2xl font-black uppercase text-xs">Find & Connect</button>
            <p id="status" class="hidden mt-6 text-xs text-gray-500 italic"></p>
        </div>
    </main>

    <!-- NAV -->
    <nav class="fixed bottom-0 left-0 right-0 bg-black/90 backdrop-blur-2xl border-t border-white/5 flex justify-around p-6 z-50">
        <button onclick="show('home')" class="text-blue-500 font-black text-[10px] uppercase tracking-widest">Briefing</button>
        <button onclick="show('settings')" class="text-gray-400 font-black text-[10px] uppercase tracking-widest">Agent</button>
    </nav>

    <script>
        function show(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('view-active'));
            document.getElementById(id).classList.add('view-active');
            window.scrollTo(0,0);
        }
        async function aiFind() {
            const topic = document.getElementById('topic').value;
            const s = document.getElementById('status');
            s.innerText = "AGENT SCANNING..."; s.classList.remove('hidden');
            const r = await fetch('/auto-add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({topic}) });
            const d = await r.json();
            s.innerText = d.status === 'success' ? "CONNECTED: " + d.name : "NO SIGNAL FOUND";
            if(d.status === 'success') setTimeout(() => location.reload(), 1500);
        }
        async function getBrief(btn, title) {
            btn.innerText = "DECODING...";
            const r = await fetch('/summarize', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title}) });
            const d = await r.json();
            const div = btn.nextElementSibling;
            div.innerText = d.summary; div.classList.remove('hidden');
            btn.innerText = "BRIEFED";
        }
    </script>
</body>
</html>
