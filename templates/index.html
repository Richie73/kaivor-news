        <!-- Feed Import Modal Form with Presets and Auto-Discovery -->
        <div x-show="showAddModal" class="bg-gray-900 border border-gray-800 rounded-2xl p-4 mb-6 shadow-xl" x-cloak>
            <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">Add or Discover Feed</h2>
            <form method="POST" class="space-y-3">
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Option 1: Pick a Popular Preset</label>
                    <select name="preset_url" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                        <option value="">-- Select from presets --</option>
                        <option value="https://www.theguardian.com/world/rss">The Guardian (World)</option>
                        <option value="https://feeds.bbci.co.uk/news/rss.xml">BBC News (World)</option>
                        <option value="https://techcrunch.com/feed/">TechCrunch (Tech)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Option 2: Auto-Discover via Website Domain/URL</label>
                    <input type="text" name="custom_input" placeholder="e.g. bbc.com or https://theverge.com" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Category</label>
                    <select name="feed_category" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                        <option value="World">World</option>
                        <option value="Tech">Tech</option>
                        <option value="AI">AI</option>
                        <option value="Sport">Sport</option>
                        <option value="Music">Music</option>
                        <option value="Android">Android</option>
                        <option value="Business">Business</option>
                    </select>
                </div>
                <div class="flex gap-2 pt-1">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 text-xs py-2 rounded-xl font-semibold">Import / Discover</button>
                    <button type="button" @click="showAddModal = false" class="bg-gray-800 hover:bg-gray-700 text-xs px-4 py-2 rounded-xl text-gray-300">Cancel</button>
                </div>
            </form>
        </div>
