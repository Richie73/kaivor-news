<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KAIVOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: ui-sans-serif, system-ui; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .view { display: none; }
        .view-active { display: block; }
    </style>
</head>
<body class="pb-32">

    <!-- STATIC MARKET HEADER -->
    <div class="p-4 bg-[#0a0a0a] border-b border-white/5 sticky top-0 z-50 backdrop-blur-xl bg-black/80">
        <div class="flex gap-4 overflow-x-auto no-scrollbar py-1">
            {% for m in market %}
            <div class="bg-white/5 px-4 py-2 rounded-xl border border-white/10 flex-shrink-0 min-w-[100px]">
                <p class="text-[9px] font-black text-gray-500 uppercase tracking-tighter">{{ m.s }}</p>
                <p class="text-sm font-bold text-green-500">{{ m.p }}</p>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- MAIN FEED VIEW -->
    <main id="home" class="view view-active p-6 space-y-12">
        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-4xl font-black tracking-tighter">KAIVOR</h1>
                <p class="text-[10px] font-bold text-blue-500 uppercase tracking-[0.3em]">Intelligence</p>
            </div>
            <p class="text-2xl font-black opacity-20">18°</p>
        </div>

        {% for source, data in news.items() %}
        <section>
            <div class="flex items-center gap-3 mb-6">
                <img src="{{ data.logo }}" class="w-6 h-6 rounded" onerror="this.style.display='none'">
                <h2 class="text-[11px] font-black text-gray-400 uppercase tracking-[0.4em]">{{ source }}</h2>
            </div>
            <div class="grid gap-6">
                {% for item in data.articles %}
                <div class="bg-[#0d0d0d] border border-white/5 rounded-[2.5rem] overflow-hidden shadow-2xl">
                    {% if item.img %}<img src="{{ item.img }}" class="w-full h-48 object-cover opacity-90">{% endif %}
                    <div class="p-6">
                        <a href="{{ item.link }}" class="text-[19px] font-bold leading-tight block mb-4 text-gray-100">{{ item.title }}</a>
                        <button onclick="getBrief(this, '{{ item.title|replace("'", "") }}')" class="bg-blue-600/10 text-blue-500 px-5 py-2 rounded-full font-black text-[10px] uppercase">Brief Me</button>
                        <div class="hidden mt-4 text-sm text-gray-400 italic border-l-2 border-blue-600 pl-4 py-1"></div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </section>
        {% endfor %}
    </main>

    <!-- SOURCES VIEW -->
    <main id="settings" class="view p-8 pt-20">
        <h2 class="text-3xl font-black mb-8">Signal Input</h2>
        <form action="/add" method="POST" class="space-y-4">
            <input type="text" name="name" placeholder="Signal Name" class="w-full bg-white/5 p-6 rounded-3xl border border-white/10 outline-none text-white">
            <input type="url" name="url" placeholder="RSS Endpoint" class="w-full bg-white/5 p-6 rounded-3xl border border-white/10 outline-none text-sm text-white">
            <button class="w-full bg-blue-600 p-6 rounded-3xl font-black uppercase text-sm">Activate</button>
        </form>
    </main>

    <!-- PROFESSIONAL BOTTOM NAV -->
    <nav class="fixed bottom-0 left-0 right-0 bg-black/90 backdrop-blur-3xl border-t border-white/5 flex justify-around items-center p-6 z-50">
        <button onclick="show('home')" class="flex flex-col items-center gap-1">
            <div class="w-1.5 h-1.5 rounded-full bg-blue-500"></div>
            <span class="text-[10px] font-black uppercase tracking-widest text-blue-500">Briefing</span>
        </button>
        <button onclick="show('settings')" class="flex flex-col items-center gap-1 opacity-40 hover:opacity-100">
            <div class="w-1.5 h-1.5 rounded-full bg-gray-500"></div>
            <span class="text-[10px] font-black uppercase tracking-widest text-gray-400">Signals</span>
        </button>
    </nav>

    <script>
        function show(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('view-active'));
            document.getElementById(id).classList.add('view-active');
            window.scrollTo(0,0);
        }
        async function getBrief(btn, title) {
            btn.innerText = "DECODING...";
            const r = await fetch('/summarize', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title}) });
            const d = await r.json();
            const div = btn.nextElementSibling;
            div.innerText = d.summary; div.classList.remove('hidden');
            btn.innerText = "BRIEFED";
        }
    </script>
</body>
</html>
