<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <title>Kaivor News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background: black; color: white; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.05); }
        .hidden-view { display: none; }
        .safe-bottom { padding-bottom: 8rem; }
    </style>
</head>
<body>

    <!-- HOME VIEW -->
    <main id="view-home" class="safe-bottom p-6 pt-12">
        <h1 class="text-4xl font-black tracking-tighter mb-8 text-blue-500">Kaivor</h1>

        {% for source, articles in news_grouped.items() %}
        <div class="mb-12">
            <h2 class="text-xs font-black text-gray-500 uppercase tracking-widest mb-4">{{ source }}</h2>
            <div class="space-y-4">
                {% for item in articles %}
                <div class="bg-[#111] rounded-3xl overflow-hidden border border-white/5">
                    {% if item.img %}
                    <img src="{{ item.image }}" class="w-full h-40 object-cover opacity-80">
                    {% endif %}
                    <div class="p-5">
                        <a href="{{ item.link }}" class="text-[17px] font-bold leading-tight block mb-3">{{ item.title }}</a>
                        <div class="flex gap-2">
                            <button onclick="getBrief('{{ item.title|replace("'", "") }}', this)" class="bg-blue-600/20 text-blue-400 px-4 py-2 rounded-xl text-xs font-bold">Brief Me</button>
                            <button onclick="saveArt('{{ item.title|replace("'", "") }}', '{{ item.link }}', '{{ source }}')" class="bg-gray-800 px-4 py-2 rounded-xl text-xs font-bold">Save</button>
                        </div>
                        <p id="summary-box" class="hidden text-xs text-gray-400 mt-4 italic border-l-2 border-blue-500 pl-3 py-1"></p>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </main>

    <!-- SETTINGS VIEW -->
    <main id="view-settings" class="hidden-view safe-bottom p-6 pt-12">
        <h1 class="text-4xl font-black mb-8">Sources</h1>
        <form action="/add" method="POST" class="bg-[#111] p-6 rounded-3xl space-y-4 mb-8">
            <input type="text" name="name" placeholder="BBC News" class="w-full bg-black p-4 rounded-xl border border-white/5 outline-none">
            <input type="url" name="url" placeholder="RSS URL" class="w-full bg-black p-4 rounded-xl border border-white/5 outline-none">
            <button class="w-full bg-white text-black py-4 rounded-xl font-bold">Add Source</button>
        </form>
        {% for feed in feeds %}
        <div class="flex justify-between p-4 bg-[#111] rounded-xl mb-2">
            <span class="text-sm">{{ feed.name }}</span>
            <a href="/delete_feed/{{ feed.id }}" class="text-red-500 text-xs font-bold">Remove</a>
        </div>
        {% endfor %}
    </main>

    <!-- NAVIGATION -->
    <nav class="glass fixed bottom-0 left-0 right-0 p-6 flex justify-around items-center z-50">
        <button onclick="showView('home')" class="text-blue-500">Feed</button>
        <button onclick="showView('settings')" class="text-gray-500">Setup</button>
    </nav>

    <script>
        function showView(v) {
            document.getElementById('view-home').classList.add('hidden-view');
            document.getElementById('view-settings').classList.add('hidden-view');
            document.getElementById('view-' + v).classList.remove('hidden-view');
            window.scrollTo(0,0);
        }

        async function getBrief(title, btn) {
            btn.innerText = "Thinking...";
            const res = await fetch('/summarize', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title})
            });
            const data = await res.json();
            const box = btn.parentElement.nextElementSibling;
            box.innerText = data.summary;
            box.classList.remove('hidden');
            btn.innerText = "Briefed";
        }

        async function saveArt(title, link, source) {
            await fetch('/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title, link, source})
            });
            alert("Saved!");
        }
    </script>
</body>
</html>
