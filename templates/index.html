<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <title>Kaivor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; }
        .glass { background: rgba(15,15,15,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid #222; }
    </style>
</head>
<body class="pb-24">

    <!-- TOP HEADER -->
    <header class="glass sticky top-0 p-6 flex justify-between items-center z-50">
        <div>
            <h1 class="text-2xl font-black tracking-tighter">KAIVOR</h1>
            <p class="text-[10px] text-blue-500 font-bold uppercase tracking-widest">Intelligence</p>
        </div>
        <!-- Weather Badge -->
        <div class="text-right bg-white/5 px-4 py-2 rounded-2xl border border-white/5">
            <p class="text-lg font-bold leading-none">{{ weather.temp }}°</p>
            <p class="text-[10px] uppercase font-black text-gray-500">{{ weather.desc }}</p>
        </div>
    </header>

    <main class="p-6 space-y-10">
        {% for source, data in news_grouped.items() %}
        <section>
            <div class="flex items-center gap-3 mb-5">
                <img src="{{ data.logo }}" class="w-6 h-6 rounded-md shadow-lg" onerror="this.style.display='none'">
                <h2 class="text-xs font-black text-gray-500 uppercase tracking-widest">{{ source }}</h2>
            </div>
            
            <div class="space-y-4">
                {% for item in data.articles %}
                <div class="bg-[#111] p-5 rounded-3xl border border-white/5 shadow-xl">
                    <a href="{{ item.link }}" class="text-[17px] font-bold leading-tight block mb-4">{{ item.title }}</a>
                    <button onclick="briefMe('{{ item.title|replace("'", "") }}', this)" 
                            class="text-[10px] font-black uppercase text-blue-500 bg-blue-500/10 px-4 py-2 rounded-full">
                        Brief Me
                    </button>
                    <p class="hidden text-xs text-gray-400 mt-4 italic border-l-2 border-blue-600 pl-3 py-1"></p>
                </div>
                {% endfor %}
            </div>
        </section>
        {% endfor %}
    </main>

    <script>
        async function briefMe(title, btn) {
            btn.innerText = "Processing...";
            const res = await fetch('/summarize', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title})
            });
            const data = await res.json();
            const box = btn.nextElementSibling;
            box.innerText = data.summary;
            box.classList.remove('hidden');
            btn.innerText = "Briefed";
        }
    </script>
</body>
</html>
