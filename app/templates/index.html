<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KAIVOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* INCREASED PADDING TO PREVENT CUTOFF */
        .view { display: none; padding-top: 175px; padding-bottom: 120px; } .view-active { display: block; }
        .top-bar { position: fixed; top: 0; left: 0; right: 0; background: #000; z-index: 100; border-bottom: 1px solid #111; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: #050505; border-top: 1px solid #1a1a1a; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        .chip { border: 1px solid #1a1a1a; white-space: nowrap; flex-shrink: 0; transition: 0.2s; font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 6px 18px; border-radius: 99px; }
        .chip-active { background: #2563eb !important; border-color: #3b82f6 !important; color: #fff !important; }
    </style>
</head>
<body>

    <div class="top-bar">
        <!-- FIXED NASDAQ SYMBOL -->
        <div class="h-[45px] border-b border-white/5 overflow-hidden bg-black">
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
            { "symbols": [{"proName": "BITSTAMP:BTCUSD", "title": "BTC"},{"proName": "TVC:GOLD", "title": "GOLD"},{"proName": "FOREXCOM:SPX500", "title": "S&P 500"},{"proName": "TVC:IXIC", "title": "NASDAQ"},{"proName": "TVC:USOIL", "title": "CRUDE"}], "colorTheme": "dark", "isTransparent": false, "displayMode": "adaptive", "locale": "en" }
            </script>
        </div>
        <div class="px-6 py-4 flex justify-between items-center bg-black">
            <h1 class="text-3xl font-black tracking-tighter italic">KAIVOR</h1>
            <span class="text-[8px] font-bold text-blue-500 uppercase tracking-widest">{{ status }}</span>
        </div>
        <div class="flex gap-2 overflow-x-auto no-scrollbar px-6 pb-4 bg-black">
            <button onclick="filterTab('all', this)" class="chip chip-active bg-[#111] text-white">Full Brief</button>
            {% for cat in matrix.keys() %}<button onclick="filterTab('{{ cat }}', this)" class="chip bg-[#080808] text-gray-500">{{ cat }}</button>{% endfor %}
        </div>
    </div>

    <!-- MAIN FEED -->
    <main id="view-home" class="view view-active p-6">
        <div id="news-container">
            {% for cat, articles in matrix.items() %}
            <section class="news-section mb-14" data-cat="{{ cat }}">
                <h2 class="text-[10px] font-black text-blue-500 uppercase tracking-[0.4em] mb-6 pl-3 border-l-2 border-blue-600 ml-1">{{ cat }} INTELLIGENCE</h2>
                <div class="grid gap-8">
                    {% for item in articles %}
                    <div class="bg-[#0d0d0d] rounded-[2.8rem] overflow-hidden border border-white/5 shadow-2xl active:scale-[0.98] transition-all">
                        {% if item.img %}
                        <div class="w-full aspect-video bg-[#111] overflow-hidden">
                            <img src="{{ item.img }}" class="w-full h-full object-cover opacity-90" loading="lazy">
                        </div>
                        {% endif %}
                        <div class="p-8">
                            <a href="{{ item.link }}" class="text-[20px] font-bold leading-tight block mb-6 text-gray-100">{{ item.title }}</a>
                            <div class="flex gap-3">
                                <button onclick="getBrief(this, '{{ item.title|replace("'", "") }}')" class="bg-blue-600 text-white px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-tighter">Summarize</button>
                                <button onclick="saveB('{{ item.title|replace("'", "") }}', '{{ item.link }}', '{{ item.img }}', '{{ cat }}')" class="bg-[#1a1a1a] text-gray-400 px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-tighter border border-white/5">Archive</button>
                            </div>
                            <div class="hidden mt-6 p-5 bg-blue-500/5 rounded-3xl text-sm text-gray-300 italic border-l border-blue-600"></div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </section>
            {% endfor %}
        </div>
    </main>

    <nav class="bottom-nav">
        <button onclick="showTab('home')" class="nav-btn text-blue-500 flex flex-col items-center"><span class="text-[10px] font-black uppercase tracking-widest">Feed</span></button>
        <button onclick="showTab('agent')" class="nav-btn text-gray-600 flex flex-col items-center"><span class="text-[10px] font-black uppercase tracking-widest">Discovery</span></button>
        <button onclick="showTab('vault')" class="nav-btn text-gray-600 flex flex-col items-center"><span class="text-[10px] font-black uppercase tracking-widest">Library</span></button>
    </nav>

    <script>
        function showTab(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('view-active'));
            document.getElementById('view-' + id).classList.add('view-active');
            document.querySelectorAll('.nav-btn').forEach(n => { n.classList.replace('text-blue-500', 'text-gray-600'); });
            event.currentTarget.classList.replace('text-gray-600', 'text-blue-500');
            window.scrollTo(0,0);
        }
        function filterTab(val, btn) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('chip-active', 'text-white'));
            btn.classList.add('chip-active', 'text-white');
            document.querySelectorAll('.news-section').forEach(s => { s.style.display = (val === 'all' || s.getAttribute('data-cat') === val) ? 'block' : 'none'; });
            window.scrollTo(0,0);
        }
        async function saveB(title, link, img, source, cat) {
            await fetch('/intel/save', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title, link, img, source, cat}) });
            alert("SECURED IN LIBRARY");
        }
        async function getBrief(btn, title) {
            btn.innerText = "...";
            const r = await fetch('/intel/brief', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title}) });
            const d = await r.json();
            btn.parentElement.nextElementSibling.innerText = d.summary;
            btn.parentElement.nextElementSibling.classList.remove('hidden');
            btn.innerText = "Briefed";
        }
    </script>
</body>
</html>
