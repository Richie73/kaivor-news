<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KAIVOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* THE COMMAND CENTER */
        .app-header { position: fixed; top: 0; left: 0; right: 0; background: #000; z-index: 100; border-bottom: 1px solid #111; }
        
        /* DYNAMIC SPACING - FIXES OVERLAP */
        .main-content { padding-top: 180px; padding-bottom: 100px; } 

        /* IMAGE INTEGRITY - FIXES CUTOFF */
        .img-box { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #0a0a0a; border-bottom: 1px solid #111; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #050505; border-top: 1px solid #1a1a1a; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        .chip { border: 1px solid #1a1a1a; white-space: nowrap; font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 6px 18px; border-radius: 99px; color: #555; }
        .chip-active { background: #2563eb !important; border-color: #3b82f6 !important; color: #fff !important; }
    </style>
</head>
<body>

    <div class="app-header">
        <!-- GLOBAL MARKET TICKER -->
        <div class="h-[45px] border-b border-white/5 overflow-hidden bg-black">
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
            { "symbols": [
                {"proName": "BITSTAMP:BTCUSD", "title": "BTC"},
                {"proName": "TVC:GOLD", "title": "GOLD"},
                {"proName": "TVC:SPX", "title": "S&P 500"},
                {"proName": "TVC:IXIC", "title": "NASDAQ"},
                {"proName": "FX_IDC:GBPUSD", "title": "GBP/USD"}
            ], "colorTheme": "dark", "isTransparent": false, "displayMode": "adaptive", "locale": "en" }
            </script>
        </div>
        <div class="px-6 py-4 flex justify-between items-center bg-black">
            <h1 class="text-3xl font-black tracking-tighter italic">KAIVOR</h1>
            <div class="bg-blue-600/10 px-3 py-1 rounded-full border border-blue-500/20"><span class="text-[8px] font-black text-blue-500 uppercase tracking-widest">Live Terminal</span></div>
        </div>
        <div class="flex gap-2 overflow-x-auto no-scrollbar px-6 pb-4 bg-black">
            <button onclick="filterTab('all', this)" class="chip chip-active text-white">Full Brief</button>
            {% for cat in matrix.keys() %}<button onclick="filterTab('{{ cat }}', this)" class="chip">{{ cat }}</button>{% endfor %}
        </div>
    </div>

    <main id="view-home" class="main-content p-6">
        <div id="news-container">
            {% for cat, articles in matrix.items() %}
            <section class="news-section mb-14" data-cat="{{ cat }}">
                <h2 class="text-[10px] font-black text-blue-500 uppercase tracking-[0.4em] mb-6 border-l-2 border-blue-600 pl-3">{{ cat }} Intelligence</h2>
                <div class="grid gap-8">
                    {% for item in articles %}
                    <div class="bg-[#0d0d0d] rounded-[2.5rem] overflow-hidden border border-white/5 shadow-2xl">
                        {% if item.img %}
                        <div class="img-box">
                            <img src="{{ item.img }}" loading="lazy" onerror="this.parentElement.style.display='none'">
                        </div>
                        {% endif %}
                        <div class="p-8">
                            <a href="{{ item.link }}" class="text-[21px] font-bold leading-tight block mb-6 text-gray-100">{{ item.title }}</a>
                            <div class="flex gap-3">
                                <button onclick="getBrief(this, '{{ item.title|replace("'", "") }}')" class="bg-blue-600 text-white px-6 py-2.5 rounded-full text-[10px] font-black uppercase">Summary</button>
                                <button onclick="saveB('{{ item.title|replace("'", "") }}', '{{ item.link }}', '{{ item.img }}', '{{ item.source }}')" class="bg-[#1a1a1a] text-gray-400 px-6 py-2.5 rounded-full text-[10px] font-black uppercase border border-white/5">Save</button>
                            </div>
                            <div class="hidden mt-6 p-5 bg-blue-500/5 rounded-3xl text-sm text-gray-300 italic border-l border-blue-600"></div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </section>
            {% endfor %}
        </div>
    </main>

    <nav class="bottom-nav">
        <button onclick="showTab('home')" class="text-blue-500 flex flex-col items-center font-black text-[10px] uppercase">Feed</button>
        <button onclick="showTab('agent')" class="text-gray-600 flex flex-col items-center font-black text-[10px] uppercase">Explore</button>
        <button onclick="showTab('vault')" class="text-gray-600 flex flex-col items-center font-black text-[10px] uppercase">Library</button>
    </nav>

    <script>
        function showTab(id) {
            document.querySelectorAll('.main-content').forEach(v => v.style.display = 'none');
            document.getElementById('view-home').style.display = 'block';
            window.scrollTo(0,0);
        }
        function filterTab(val, btn) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('chip-active', 'text-white'));
            btn.classList.add('chip-active', 'text-white');
            document.querySelectorAll('.news-section').forEach(s => { s.style.display = (val === 'all' || s.getAttribute('data-cat') === val) ? 'block' : 'none'; });
            window.scrollTo(0,0);
        }
        async function getBrief(btn, title) {
            btn.innerText = "Processing...";
            const r = await fetch('/intel/brief', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title}) });
            const d = await r.json();
            btn.parentElement.nextElementSibling.innerText = d.summary;
            btn.parentElement.nextElementSibling.classList.remove('hidden');
            btn.innerText = "Summary";
        }
        async function saveB(title, link, img, source) {
            await fetch('/intel/save', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title, link, img, source}) });
            alert("SAVED TO LIBRARY");
        }
    </script>
</body>
</html>
